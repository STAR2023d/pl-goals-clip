[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-goals-clip"
version = "0.1.0"
description = "Pipeline to find, clip and edit Premier League goals by match week from official sources, produced match-by-match (not one clip per goal)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DAN KAMAU MWAURA", email = "mwauradan37@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
plgc = "plgoalsclip.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["plgoalsclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
